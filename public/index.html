<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat with Ashar's Assistant</title>
<meta name="description" content="Ask an AI assistant anything about Ashar Farooq — software engineer, MIT grad, and world traveler." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b1020;
    --bg-2: #121a33;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-solid: #151d38;
    --border: rgba(255, 255, 255, 0.09);
    --text: #eef2ff;
    --muted: #9aa6c7;
    --accent: #7c8cff;
    --accent-2: #52e0c4;
    --user-bubble: linear-gradient(135deg, #6d7cff, #8b6bff);
    --bot-bubble: #1b2447;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(124, 140, 255, 0.22), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(82, 224, 196, 0.14), transparent 55%),
      var(--bg);
    display: flex;
    justify-content: center;
    padding: clamp(12px, 3vw, 40px);
  }

  .app {
    width: 100%;
    max-width: 780px;
    height: min(92vh, 900px);
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    backdrop-filter: blur(12px);
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(11, 16, 32, 0.5);
  }
  .avatar {
    width: 46px; height: 46px;
    flex: 0 0 auto;
    border-radius: 50%;
    display: grid; place-items: center;
    font-family: "Sora", sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #0b1020;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 18px rgba(124, 140, 255, 0.4);
  }
  .head-text h1 {
    font-family: "Sora", sans-serif;
    font-size: 17px;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .head-text p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 0 0 rgba(82, 224, 196, 0.6);
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(82,224,196,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(82,224,196,0); }
    100% { box-shadow: 0 0 0 0 rgba(82,224,196,0); }
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 20px; }

  .msg { display: flex; gap: 10px; max-width: 88%; animation: rise 0.35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .who {
    width: 30px; height: 30px; flex: 0 0 auto;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700;
    margin-top: 2px;
  }
  .msg.bot .who { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0b1020; }
  .msg.user .who { background: rgba(255,255,255,0.1); color: var(--text); }

  .bubble {
    padding: 12px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 5px;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-top-right-radius: 5px;
  }
  .bubble strong { font-weight: 600; }
  .bubble a { color: var(--accent-2); }

  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.3s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }

  .suggestions {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 4px 20px 14px;
  }
  .chip {
    font: inherit;
    font-size: 12.5px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 8px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { background: rgba(124,140,255,0.16); border-color: var(--accent); transform: translateY(-1px); }

  form {
    display: flex; gap: 10px;
    padding: 14px 16px 16px;
    border-top: 1px solid var(--border);
    background: rgba(11,16,32,0.5);
  }
  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    font-size: 14.5px;
    color: var(--text);
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    max-height: 120px;
    line-height: 1.4;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,140,255,0.2); }
  textarea::placeholder { color: var(--muted); }
  button.send {
    flex: 0 0 auto;
    width: 46px; height: 46px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b1020;
    cursor: pointer;
    display: grid; place-items: center;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button.send:hover:not(:disabled) { transform: translateY(-1px); }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }
  button.send svg { width: 20px; height: 20px; }

  footer.note {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 0 0 10px;
  }
  footer.note a { color: var(--muted); }

  @media (max-width: 520px) {
    body { padding: 0; }
    .app { height: 100vh; height: 100dvh; border-radius: 0; border: none; }
    .msg { max-width: 94%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <main class="app">
    <header>
      <div class="avatar">AF</div>
      <div class="head-text">
        <h1>Ashar's Assistant</h1>
        <p><span class="dot"></span> Ask me anything about Ashar Farooq</p>
      </div>
    </header>

    <div class="chat" id="chat" aria-live="polite"></div>

    <div class="suggestions" id="suggestions">
      <button class="chip">Who is Ashar?</button>
      <button class="chip">Where does he work?</button>
      <button class="chip">Tell me about his MIT background</button>
      <button class="chip">What projects has he built?</button>
      <button class="chip">How can I contact him?</button>
    </div>

    <form id="form">
      <textarea id="input" rows="1" placeholder="Type your question…" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
    <footer class="note">AI assistant grounded in <a href="https://asharfarooq.xyz" target="_blank" rel="noopener">asharfarooq.xyz</a>. May occasionally be imperfect.</footer>
  </main>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const suggestions = document.getElementById("suggestions");

  // Conversation history sent to the server each turn.
  const history = [];

  // Minimal, safe markdown: **bold**, links, and line breaks. Escapes HTML first.
  function render(text) {
    const esc = text
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\b(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/([\w.+-]+@[\w-]+\.[\w.-]+)/g, '<a href="mailto:$1">$1</a>');
  }

  function addMessage(role, text) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + (role === "user" ? "user" : "bot");
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "You" : "AF";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = render(text);
    wrap.append(who, bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.id = "typing-indicator";
    wrap.innerHTML = '<div class="who">AF</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }
  function hideTyping() {
    document.getElementById("typing-indicator")?.remove();
  }

  async function send(text) {
    const q = text.trim();
    if (!q) return;
    suggestions.style.display = "none";
    addMessage("user", q);
    history.push({ role: "user", content: q });
    input.value = "";
    autoGrow();
    setBusy(true);
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      hideTyping();
      if (!res.ok) {
        addMessage("bot", data.error || "Something went wrong. Please try again.");
      } else {
        addMessage("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
      }
    } catch {
      hideTyping();
      addMessage("bot", "I couldn't reach the server. Check your connection and try again.");
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  function setBusy(b) {
    sendBtn.disabled = b;
    input.disabled = b;
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
  });
  suggestions.addEventListener("click", (e) => {
    if (e.target.classList.contains("chip")) send(e.target.textContent);
  });

  // Greeting
  addMessage("bot", "Hi! 👋 I'm Ashar's assistant. I can tell you about his background, his work at SantAI, his MIT education, the projects he's built, and how to get in touch. What would you like to know?");
  input.focus();
</script>
</body>
</html>
